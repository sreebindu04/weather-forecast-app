
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-app">
        <h1>Weather Forecast 🌦️</h1>
        <p>Check the weather in your city</p>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message">Search for a city to see its weather.</p>

        <section id="weather-result" hidden>
    <h2 id="city-name"></h2>
    <p id="temperature"></p>
<button id="unit-toggle" type="button">Switch to °F</button>
    <p id="condition"></p>
    <p id="humidity"></p>
    <p id="wind"></p>

    <h3 class="forecast-title">5-Day Forecast</h3>
    <div id="forecast" class="forecast-grid"></div>
</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
